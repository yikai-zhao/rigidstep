name: C++ correctness
on:
  push:
  pull_request:
jobs:
  gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke demo and benchmark
        run: |
          ./build/rigidstep demo --bodies 16 --frames 50 --out /tmp/rigidstep-smoke.jsonl
          python3 scripts/verify_trace.py /tmp/rigidstep-smoke.jsonl
          ./build/rigidstep benchmark --scene sparse --bodies 36 --frames 15 --repeats 1 --out /tmp/rigidstep-bench.csv
          python3 scripts/benchmark_report.py /tmp/rigidstep-bench.csv
      - name: Adversarial trace parser tests
        run: python3 -m unittest discover -s tests -p test_trace_validator.py -v
      - name: Archived V0.2 cold-path regression
        run: |
          g++ -std=c++20 -O2 -I include apps/rigidstep.cpp benchmarks/legacy-v02/physics.cpp -o build/rigidstep-v02
          python3 scripts/verify_cold_regression.py --baseline build/rigidstep-v02 --candidate build/rigidstep --output /tmp/cold-v02-regression.json
      - name: Read-only SAT debug normals smoke test
        run: |
          ./build/rigidstep demo --scene stack --bodies 36 --frames 80 --edge-contact on --contact-overlay on --out /tmp/edge-contact.jsonl
          python3 scripts/verify_trace.py /tmp/edge-contact.jsonl
      - name: Warm-start cache smoke test (must actually reuse impulses)
        run: |
          ./build/rigidstep demo --scene stack --bodies 32 --frames 180 --iterations 2 --warm-start on --out /tmp/warmtrace.jsonl
          python3 scripts/verify_trace.py /tmp/warmtrace.jsonl --require-warm-applied
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DRIGIDSTEP_SANITIZERS=ON
      - run: cmake --build build-asan --parallel 2
      - run: ctest --test-dir build-asan --output-on-failure
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
